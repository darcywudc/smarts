<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Amazing Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #ff0055;
            --bg-angle: 45deg;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(var(--bg-angle), #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Particle Container */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            z-index: 1;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--primary), #ffffff, var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200%;
            animation: shine 5s linear infinite;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 15px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        #greeting-container {
            margin-top: 30px;
            min-height: 20px; /* Prevent layout shift */
            text-align: center;
        }

        .greeting {
            font-size: 1.8rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .greeting span {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating Shapes */
        .shape {
            position: absolute;
            filter: blur(50px);
            z-index: -1;
            animation: float 20s infinite;
            opacity: 0.6;
        }

        .shape-1 {
            top: -10%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: var(--secondary);
            border-radius: 50%;
            animation-delay: 0s;
        }

        .shape-2 {
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: var(--primary);
            border-radius: 50%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 30px 20px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating background shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <!-- Canvas for particles -->
    <canvas id="particles"></canvas>

    <div class="container">
        <h1>Welcome</h1>
        <form id="greetForm">
            <div class="input-group">
                <input type="text" id="name" name="name" placeholder="What's your name?" required autocomplete="off">
            </div>
            <button type="submit">Say Hello</button>
        </form>
        <div id="greeting-container">
            <!-- Greeting will appear here -->
            {% if greeting %}
                <div class="greeting">Hello, <span>{{ greeting.replace('Hello, ', '').replace('!', '') }}</span>!</div>
            {% endif %}
        </div>
    </div>

    <script>
        // Particle System
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // AJAX Form Handling
        const form = document.getElementById('greetForm');
        const greetingContainer = document.getElementById('greeting-container');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('name');
            const name = nameInput.value;
            const button = form.querySelector('button');
            const originalText = button.innerText;

            // Button loading state
            button.innerText = 'Sending...';
            button.style.opacity = '0.7';

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name: name })
                });

                if (response.ok) {
                    const data = await response.json();

                    // Clear previous content with fade out if exists
                    greetingContainer.innerHTML = '';

                    // Create new greeting element
                    const greetingEl = document.createElement('div');
                    greetingEl.className = 'greeting';
                    // Highlight the name
                    const safeName = data.greeting.replace('Hello, ', '');
                    greetingEl.innerHTML = `Hello, <span>${safeName.replace('!', '')}</span>!`;

                    greetingContainer.appendChild(greetingEl);

                    // Confetti effect (simple burst)
                    createBurst(window.innerWidth / 2, window.innerHeight / 2);
                }
            } catch (error) {
                console.error('Error:', error);
            } finally {
                button.innerText = originalText;
                button.style.opacity = '1';
                nameInput.value = ''; // Clear input
            }
        });

        // Simple click burst effect
        function createBurst(x, y) {
            // This is just a visual trigger, could implement more particles here
            // For now, let's just boost the existing particles
            particles.forEach(p => {
                p.speedX += (Math.random() - 0.5) * 5;
                p.speedY += (Math.random() - 0.5) * 5;
            });

            // Slow them down after a bit
            setTimeout(() => {
                particles.forEach(p => {
                    p.speedX = Math.random() * 1 - 0.5;
                    p.speedY = Math.random() * 1 - 0.5;
                });
            }, 1000);
        }
    </script>
</body>
</html>
