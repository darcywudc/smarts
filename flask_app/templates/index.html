<!DOCTYPE html>
<html>
<head>
    <title>Flask Hello World</title>
</head>
<body>
    <h1>Hello World App</h1>
    <form method="post">
        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name">
        <button type="submit">Submit</button>
    </form>
    {% if greeting %}
        <p>{{ greeting }}</p>
    {% endif %}
</body>
</html>
